name: Publicar en GitHub Pages

# Construye la web y la publica en la rama gh-pages (GitHub Pages sirve esa rama).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Construir la web
        run: node scripts/build.mjs
        env:
          # Opcional: variables del repo (Settings → Secrets and variables → Actions → Variables)
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Publicar en gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicar ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
